name: ping
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: open an issue as the Actions bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "Fix the typo in the demo heading" --body "The heading in README.md says playgroud. Please fix that typo."
